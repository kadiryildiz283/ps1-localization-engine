# .github/workflows/ci.yml
name: 'CI'

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}'
  cancel-in-progress: '${{ github.ref != ''refs/heads/main'' }}'

permissions:
  contents: 'read'

defaults:
  run:
    shell: 'bash'

jobs:
  lint:
    name: 'Lint (ruff)'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    steps:
      - uses: 'actions/checkout@v4'
      - uses: 'actions/setup-python@v5'
        with:
          python-version: '3.12'
      - name: 'Install ruff'
        run: 'pip install ruff==0.9.6'
      - name: 'ruff check'
        run: 'ruff check tools tests engine.py'
      - name: 'ruff format --check'
        run: 'ruff format --check tools tests engine.py'

  test:
    name: 'Unit tests (pytest)'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 15
    steps:
      - uses: 'actions/checkout@v4'
      - uses: 'actions/setup-python@v5'
        with:
          python-version: '3.12'
      - name: 'Install dependencies'
        run: 'pip install -e ".[dev]"'
      - name: 'Run fast tests'
        run: 'pytest tests/ -m "not slow and not requires_assets" --tb=short'

  validate:
    name: 'Validate manifests & budgets'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    steps:
      - uses: 'actions/checkout@v4'
      - uses: 'actions/setup-python@v5'
        with:
          python-version: '3.12'
      - name: 'Install dependencies'
        run: 'pip install -e ".[dev]"'
      - name: 'Manifest schema sanity'
        run: |
          python - <<'PY'
          import json, pathlib, sys

          root = pathlib.Path(".")
          manifests = sorted(root.glob("audio/*.json"))
          if not manifests:
              print("UYARI: audio/*.json bulunamadı", file=sys.stderr)
              sys.exit(1)

          required_keys = {"character", "en", "tr"}
          errors = []
          for path in manifests:
              data = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(data, list):
                  continue
              for i, row in enumerate(data):
                  if not isinstance(row, dict):
                      errors.append(f"{path}: satır {i} dict değil")
                      continue
                  # Bütçe tabloları farklı şemada olabilir; anahtar kontrolü
                  # yalnızca replik listelerinde yapılır.
                  if "cue" in row and "character" in row:
                      if "character" not in row:
                          errors.append(f"{path}[{i}]: character yok")
                      if row.get("size_bytes", 1) <= 0:
                          errors.append(f"{path}[{i}]: size_bytes pozitif değil")
                      max_dur = row.get("max_duration")
                      if max_dur is not None and max_dur <= 0:
                          errors.append(f"{path}[{i}]: max_duration pozitif değil")

          if errors:
              print("\n".join(errors[:50]), file=sys.stderr)
              print(f"Toplam hata: {len(errors)}", file=sys.stderr)
              sys.exit(1)
          print(f"OK: {len(manifests)} manifest doğrulandı")
          PY

      - name: 'SPU duration budget check'
        run: |
          python - <<'PY'
          import json, pathlib, sys

          path = pathlib.Path("audio/deterministic_manifest.json")
          if not path.exists():
              print("deterministic_manifest.json yok — atlanıyor")
              sys.exit(0)

          rows = json.loads(path.read_text(encoding="utf-8"))
          # ADPCM: 16 bayt blok = 28 örnek @ 22050 Hz
          # max_allowed_samples / sample_rate >= max_duration - epsilon
          bad = []
          for r in rows:
              sr = r.get("target_sample_rate") or 22050
              max_s = r.get("max_allowed_samples")
              max_d = r.get("max_duration")
              if not max_s or not max_d:
                  continue
              computed = max_s / float(sr)
              if computed + 0.02 < max_d:
                  bad.append(f"{r.get('stem')} cue {r.get('cue')}: {computed:.3f}s < {max_d:.3f}s")

          if bad:
              print("\n".join(bad[:30]), file=sys.stderr)
              print(f"Bütçe ihlali: {len(bad)}", file=sys.stderr)
              sys.exit(1)
          print(f"OK: {len(rows)} cue süre bütçesi tutarlı")
          PY

  repo-hygiene:
    name: 'Repo hygiene'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    steps:
      - uses: 'actions/checkout@v4'
      - name: 'No copyrighted binaries tracked'
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -Ei '\.(bin|cue|wad|gam|iso|exe|so|wav|mp3|ogg|vag)$' || true)
          if [[ -n "${bad}" ]]; then
            echo "Telifli/binary dosyalar izleniyor:" >&2
            echo "${bad}" >&2
            exit 1
          fi
          echo "OK: izlenen binary yok"
      - name: 'Required root files exist'
        run: |
          set -euo pipefail
          for f in AGENTS.md CONTRIBUTING.md README.md SECURITY.md LICENSE pyproject.toml .gitignore; do
            [[ -f "${f}" ]] || { echo "Eksik: ${f}" >&2; exit 1; }
          done
          echo "OK: kök dosyalar yerinde"
