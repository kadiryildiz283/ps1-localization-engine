<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>PS1toWASM — Web Player</title>
  <script src="./coi-serviceworker.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nostalgist@0.17.1/dist/nostalgist.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100dvh; overflow: hidden;
      background: #000; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif;
      user-select: none; -webkit-user-select: none; touch-action: none;
    }
    #stage {
      position: relative; width: 100vw; height: 100dvh;
      display: flex; align-items: center; justify-content: center; background: #000;
    }
    canvas#screen {
      width: min(100vw, calc(100dvh * 4 / 3)) !important;
      height: min(100dvh, calc(100vw * 3 / 4)) !important;
      image-rendering: pixelated; display: block;
    }

    /* Başlangıç (Splash) Ekranı */
    #splash {
      position: absolute; inset: 0; z-index: 30;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      background: radial-gradient(circle at center, #111827 0%, #030712 100%);
      padding: 24px; text-align: center;
    }
    #splash.hidden { display: none; }
    #game-title { font-size: clamp(1.3rem, 3.5vw, 2.2rem); font-weight: 800; letter-spacing: 0.04em; margin: 0; }
    #splash-sub { font-size: 0.9rem; color: #94a3b8; margin: 0; }
    #progress-wrap { width: min(360px, 85vw); }
    progress { width: 100%; height: 8px; accent-color: #3b82f6; border-radius: 99px; }
    #status { font-size: 0.85rem; color: #93c5fd; margin-top: 6px; min-height: 1.2em; }
    #play-btn {
      background: #2563eb; color: #fff; border: none; border-radius: 999px;
      padding: 14px 36px; font-size: 1.05rem; font-weight: 700; cursor: pointer;
      box-shadow: 0 8px 28px rgba(37, 99, 235, 0.45); transition: transform 0.12s ease;
    }
    #play-btn:active { transform: scale(0.96); }
    #play-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #bios-pick-wrap { font-size: 0.8rem; color: #94a3b8; }
    #bios-pick-wrap label { text-decoration: underline; cursor: pointer; }
    #bios-pick-wrap input { display: none; }

    /* Yüzen Üst Araç Çubuğu */
    #hud {
      position: absolute; top: max(8px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right));
      z-index: 25; display: flex; gap: 6px; padding: 5px 8px; border-radius: 999px;
      background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(8px);
      border: 1px solid rgba(148, 163, 184, 0.2); opacity: 0.85; transition: opacity 0.2s;
    }
    #hud:hover { opacity: 1; }
    #hud.hidden { display: none; }
    .hud-btn {
      background: transparent; color: #e2e8f0; border: none; border-radius: 999px;
      padding: 6px 10px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
    }
    .hud-btn:hover { background: rgba(255, 255, 255, 0.12); }

    /* Sanal Dokunmatik PS1 Kontrolcüsü */
    #touch-pad {
      position: absolute; inset: 0; z-index: 20; pointer-events: none;
      display: none;
    }
    #touch-pad.visible { display: block; }
    .pad-group {
      position: absolute; bottom: max(14px, env(safe-area-inset-bottom));
      pointer-events: none;
    }
    .pad-left { left: max(14px, env(safe-area-inset-left)); width: 156px; height: 156px; }
    .pad-right { right: max(14px, env(safe-area-inset-right)); width: 164px; height: 164px; }
    .pad-shoulders-left {
      position: absolute; top: max(52px, calc(env(safe-area-inset-top) + 46px));
      left: max(14px, env(safe-area-inset-left)); display: flex; gap: 8px; pointer-events: none;
    }
    .pad-shoulders-right {
      position: absolute; top: max(52px, calc(env(safe-area-inset-top) + 46px));
      right: max(14px, env(safe-area-inset-right)); display: flex; gap: 8px; pointer-events: none;
    }
    .pad-center {
      position: absolute; bottom: max(14px, env(safe-area-inset-bottom)); left: 50%;
      transform: translateX(-50%); display: flex; gap: 14px; pointer-events: none;
    }
    .vbtn {
      pointer-events: auto; position: relative; display: flex; align-items: center; justify-content: center;
      background: rgba(30, 41, 59, 0.55); border: 1.5px solid rgba(255, 255, 255, 0.28);
      color: rgba(255, 255, 255, 0.9); font-weight: 700; font-size: 0.95rem;
      backdrop-filter: blur(4px); touch-action: none;
    }
    .vbtn.active { background: rgba(59, 130, 246, 0.72); border-color: #93c5fd; transform: scale(0.94); }
    .dpad-btn { position: absolute; width: 50px; height: 50px; border-radius: 10px; }
    .d-up { top: 0; left: 53px; }
    .d-down { bottom: 0; left: 53px; }
    .d-left { top: 53px; left: 0; }
    .d-right { top: 53px; right: 0; }
    .face-btn { position: absolute; width: 52px; height: 52px; border-radius: 50%; font-size: 1.05rem; }
    .f-tri { top: 0; left: 56px; color: #4ade80; }
    .f-cir { top: 56px; right: 0; color: #f87171; }
    .f-cro { bottom: 0; left: 56px; color: #60a5fa; }
    .f-squ { top: 56px; left: 0; color: #f472b6; }
    .sh-btn { width: 54px; height: 34px; border-radius: 8px; font-size: 0.8rem; }
    .sys-btn { padding: 7px 14px; border-radius: 999px; font-size: 0.72rem; letter-spacing: 0.05em; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="screen" width="640" height="480"></canvas>

    <div id="hud" class="hidden">
      <button id="pause-btn" class="hud-btn" title="Duraklat / Devam">⏸</button>
      <button id="save-btn" class="hud-btn" title="Hızlı Kaydet">💾</button>
      <button id="load-btn" class="hud-btn" title="Kaydı Yükle">📂</button>
      <button id="pad-toggle-btn" class="hud-btn" title="Dokunmatik Tuşlar">🎮</button>
      <button id="fs-btn" class="hud-btn" title="Tam Ekran">⛶</button>
    </div>

    <div id="touch-pad">
      <div class="pad-shoulders-left">
        <button class="vbtn sh-btn" data-key="KeyQ" data-code="KeyQ">L1</button>
        <button class="vbtn sh-btn" data-key="Digit1" data-code="Digit1">L2</button>
      </div>
      <div class="pad-shoulders-right">
        <button class="vbtn sh-btn" data-key="Digit2" data-code="Digit2">R2</button>
        <button class="vbtn sh-btn" data-key="KeyW" data-code="KeyW">R1</button>
      </div>
      <div class="pad-group pad-left">
        <button class="vbtn dpad-btn d-up" data-key="ArrowUp" data-code="ArrowUp">▲</button>
        <button class="vbtn dpad-btn d-down" data-key="ArrowDown" data-code="ArrowDown">▼</button>
        <button class="vbtn dpad-btn d-left" data-key="ArrowLeft" data-code="ArrowLeft">◀</button>
        <button class="vbtn dpad-btn d-right" data-key="ArrowRight" data-code="ArrowRight">▶</button>
      </div>
      <div class="pad-center">
        <button class="vbtn sys-btn" data-key="ShiftRight" data-code="ShiftRight">SELECT</button>
        <button class="vbtn sys-btn" data-key="Enter" data-code="Enter">START</button>
      </div>
      <div class="pad-group pad-right">
        <button class="vbtn face-btn f-tri" data-key="KeyS" data-code="KeyS">△</button>
        <button class="vbtn face-btn f-cir" data-key="KeyX" data-code="KeyX">○</button>
        <button class="vbtn face-btn f-cro" data-key="KeyZ" data-code="KeyZ">✕</button>
        <button class="vbtn face-btn f-squ" data-key="KeyA" data-code="KeyA">□</button>
      </div>
    </div>

    <div id="splash">
      <h1 id="game-title">PS1toWASM</h1>
      <p id="splash-sub">Hazırlanıyor...</p>
      <div id="progress-wrap">
        <progress id="progress" value="0" max="100"></progress>
        <div id="status">Disk bilgisi yükleniyor...</div>
      </div>
      <button id="play-btn" disabled>OYUNA BAŞLA</button>
      <div id="bios-pick-wrap">
        <label>Farklı BIOS seç (opsiyonel)<input id="bios-input" type="file" accept=".bin,.rom" /></label>
      </div>
    </div>
  </div>
  <script type="module" src="./runtime.js"></script>
</body>
</html>
